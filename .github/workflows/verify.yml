name: Verify SolicitaFlow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
      AI_ENABLED: 'false'
      SF_REAL_AI_ENABLED: 'false'
      DEEPSEEK_API_KEY: OFFLINE_TESTS_NO_REAL_KEY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and browser tools
        run: python -m pip install -r backend/requirements-dev.txt -r backend/requirements-ops.txt playwright==1.65.1
      - name: Bootstrap isolated databases and check additive compatibility
        run: python scripts/ci_database.py
      - name: Fresh cloud schema and encrypted restore
        env:
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/pg18"
          for tool in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker exec -i -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGHOST -e PGPORT %s %s "$@"\n' '${{ job.services.postgres.id }}' "$tool" > "$RUNNER_TEMP/pg18/$tool"
            chmod +x "$RUNNER_TEMP/pg18/$tool"
          done
          export PATH="$RUNNER_TEMP/pg18:$PATH"
          python scripts/ci_cloud.py
      - name: Backend (real AI blocked)
        working-directory: backend
        run: python -m pytest -q
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Install browser and accessibility tool
        run: |
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/qa" --no-save --package-lock=false axe-core@4.14.0
      - name: Chromium journey, themes, accessibility and visitor isolation
        env:
          PGDATABASE: ai_request_classifier
          PGUSER: ai_classifier_app
          PGPASSWORD: ${{ env.SF_APP_PASSWORD }}
        run: |
          export AI_ENABLED=true SF_REAL_AI_ENABLED=true SF_QA_MODE=true
          export SF_AI_DAILY_CALLS=1000 SF_AI_WORKSPACE_CALLS=2 SF_AI_HOURLY_IP_CALLS=1000 SF_AI_DAILY_TOKENS=10000000 SF_AI_DAILY_USD=10
          python scripts/seed_local.py
          (python scripts/browser_backend.py > "$RUNNER_TEMP/backend.log" 2>&1) &
          (cd frontend && npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/frontend.log" 2>&1) &
          python scripts/wait_local.py
          python scripts/browser_brand.py --output "$RUNNER_TEMP/captures" --axe "$RUNNER_TEMP/qa/node_modules/axe-core/axe.min.js" --channel chrome
          python scripts/browser_lab.py --output "$RUNNER_TEMP/captures" --axe "$RUNNER_TEMP/qa/node_modules/axe-core/axe.min.js" --channel chrome
      - name: Public HTTPS, compiled UI, cookies, SLA and isolation (mock AI)
        run: python scripts/run_public_qa.py --output "$RUNNER_TEMP/captures/public" --axe "$RUNNER_TEMP/qa/node_modules/axe-core/axe.min.js" --channel chrome
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-laboratory
          path: ${{ runner.temp }}/captures
          retention-days: 7
          if-no-files-found: ignore
